<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#0F2B3D">
  <link rel="icon" type="image/jpeg" href="/imgs/logo.jpg">
  <title>Página no encontrada – Konys Pizza</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
  <!-- Rutas absolutas: esta página puede mostrarse en cualquier URL -->
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body class="pagina-404">
  <header class="header">
    <div class="contenedor header-fila">
      <a href="/" class="logo" aria-label="Konys Pizza, inicio">
        <img src="/imgs/logo.jpg" alt="" class="logo-imagen" width="46" height="46">
        <span class="logo-texto">
          <span class="logo-nombre">KONYS</span>
          <span class="logo-sub">PIZZA</span>
        </span>
      </a>
    </div>
  </header>

  <main class="error-404 contenedor">
    <div class="error-404-imagen" aria-hidden="true">
      <!-- Porción de pizza con un mordisco -->
      <svg viewBox="0 0 200 200" width="220" height="220">
        <path d="M100 18 L182 168 Q100 196 18 168 Z" fill="#E9A54F"/>
        <path d="M100 40 L166 160 Q100 182 34 160 Z" fill="#F6D58E"/>
        <circle cx="100" cy="92" r="11" fill="#C2410C"/>
        <circle cx="78" cy="136" r="12" fill="#C2410C"/>
        <circle cx="126" cy="140" r="10" fill="#C2410C"/>
        <path d="M108 118 q6-7 12 0M86 104 q6-7 12 0" stroke="#3F7D3A" stroke-width="5" fill="none" stroke-linecap="round"/>
        <circle cx="160" cy="150" r="20" fill="var(--color-fondo)"/>
        <circle cx="146" cy="168" r="14" fill="var(--color-fondo)"/>
      </svg>
    </div>
    <p class="error-404-codigo">404</p>
    <h1>Esta página se la comieron</h1>
    <p class="texto-suave">La dirección que buscas no existe o cambió de lugar. Pero tu mesa sigue esperándote.</p>
    <div class="error-404-botones">
      <a href="/" class="btn btn-primario">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>
        Volver al inicio
      </a>
      <a href="/#mesas" class="btn btn-secundario">Reservar una mesa</a>
      <a href="/#carta" class="btn btn-secundario">Ver la carta</a>
    </div>
  </main>
</body>
</html>
